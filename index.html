<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[만약...]</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--card:#fff;--ink:#18213a;--sub:#5b6478;--line:#d5dae6;--mark:#18213a;--markink:#fff;--hl:#f4c542;--hlink:#18213a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#e8ecf6;--sub:#98a1b8;--line:#2d3550;--mark:#e8ecf6;--markink:#12151f;--hl:#f4c542;--hlink:#18213a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#e8ecf6;--sub:#98a1b8;--line:#2d3550;--mark:#e8ecf6;--markink:#12151f;--hl:#f4c542;--hlink:#18213a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--hl);transition:width .25s}
.step{font-size:.85rem;color:var(--sub);margin:0 0 22px}
h1{font-size:2rem;line-height:1.25;margin:12vh 0 14px;letter-spacing:-.02em}
h1 small{display:block;font-size:1rem;font-weight:500;color:var(--sub);margin-top:10px;letter-spacing:0}
.lead{color:var(--sub);margin:0 0 32px}
h2{font-size:1.35rem;line-height:1.45;margin:0 0 24px;letter-spacing:-.01em}
.tag{display:inline-block;font-size:.85rem;font-weight:600;background:var(--hl);color:var(--hlink);padding:2px 10px;border-radius:4px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer;min-height:56px}
.opt .b{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:.85rem;font-weight:700;transition:background .15s,color .15s}
.opt.on{border-color:var(--mark)}
.opt.on .b{background:var(--mark);color:var(--markink)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
input[type=text]{width:100%;font:inherit;font-size:1.3rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-bottom:3px solid var(--ink);border-radius:10px 10px 4px 4px;padding:14px 16px}
.cnt{text-align:right;font-size:.85rem;color:var(--sub);margin:6px 2px 0}
.hint{color:var(--sub);font-size:.9rem;margin:0 0 14px}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:1.05rem;color:var(--markink);background:var(--mark);border:0;border-radius:12px;padding:16px;margin-top:24px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.sec{font-weight:700;margin:28px 0 10px}
.row{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row p{margin:0}
.row .if{color:var(--sub);font-size:.95rem}
.row .then{margin-top:6px;font-weight:600}
.row .then::before{content:"→ ";color:var(--sub);font-weight:400}
.final{margin:32px 0 0;padding:20px;border-radius:12px;background:var(--hl);color:var(--hlink);font-weight:600;line-height:1.7}
@media (prefers-reduced-motion:reduce){.bar i,.opt .b{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S=[
{g:"대처",q:"연필을 사용하다가 심이 부러졌어요.",o:["샤프를 사용할래요.","미리 준비해 둔 여분의 연필을 사용할래요."]},
{g:"대처",q:"수정테이프에 문제가 생겼어요.",o:["추가로 요청할래요.","급한 대로 손톱으로 눌러서 사용할래요."]},
{g:"멘탈",q:"주변 사람이 다리를 심하게 떨어요."},
{g:"멘탈",q:"평소에는 잘 풀리던 부분에서 막혔어요."},
{g:"멘탈",q:"나는 아직 문제를 풀고 있는데, 주변에서 시험지를 넘기는 소리가 들려 나만 뒤쳐지는 것 같아요."},
{g:"멘탈",q:"분배한 시간보다 시간을 더 써버렸어요."},
{g:"멘탈",q:"아직 못 푼 문제가 많은데 시험 종료 예비 방송이 나왔어요."},
{g:"멘탈",q:"주변에서 부정행위가 적발됐어요."},
{g:"멘탈",q:"부정행위를 했다는 의심을 받았어요."},
{g:"멘탈",q:"한 과목의 시험이 종료된 후 다른 사람들이 답을 맞춰 보는 소리가 들리는데, 내 답은 모두 다른 것 같아요."}
];
var MAX=7, i=-1, A=[], app=document.getElementById("app");
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function len(s){return Array.from(s).length}
function clip(s){return Array.from(s).slice(0,MAX).join("")}
function head(){
  var w=h("div");
  var bar=h("div","bar"),f=h("i");f.style.width=(i/S.length*100)+"%";bar.appendChild(f);
  w.appendChild(bar);w.appendChild(h("p","step",(i+1)+" / "+S.length));
  return w;
}
function start(){
  app.textContent="";
  var t=h("h1",null,"[만약...]");
  app.appendChild(t);
  app.appendChild(h("p","lead","시험 중에 생길 수 있는 상황 "+S.length+"가지를 미리 떠올려 봐요. 멘탈 상황의 답은 "+MAX+"자 이내로 적어요."));
  var b=h("button","btn","시작하기");b.onclick=function(){i=0;A=[];show()};
  app.appendChild(b);
}
function show(){
  app.textContent="";
  var s=S[i];
  app.appendChild(head());
  app.appendChild(h("span","tag","[만약..."+"("+s.g+")]"));
  app.appendChild(h("h2",null,s.q));
  if(s.o){
    s.o.forEach(function(txt,k){
      var b=h("button","opt");b.type="button";
      b.appendChild(h("span","b",String(k+1)));b.appendChild(h("span",null,txt));
      b.onclick=function(){
        b.classList.add("on");
        Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(x){x.disabled=true});
        setTimeout(function(){A[i]=txt;next()},220);
      };
      app.appendChild(b);
    });
  }else{
    app.appendChild(h("p","hint","어떤 마음가짐을 가지면 좋을지, 어떤 행동을 취하면 좋을지 미리 생각해 봐요."));
    var inp=h("input");inp.type="text";inp.maxLength=MAX;inp.placeholder=MAX+"자 이내로 적어요";
    inp.setAttribute("aria-label","답변 ("+MAX+"자 이내)");inp.autocomplete="off";
    var cnt=h("p","cnt","0/"+MAX);
    var btn=h("button","btn",i===S.length-1?"결과 보기":"다음");btn.disabled=true;
    var comp=false;
    function upd(){
      if(!comp&&len(inp.value)>MAX)inp.value=clip(inp.value);
      var n=len(inp.value);cnt.textContent=n+"/"+MAX;
      btn.disabled=inp.value.trim().length===0||n>MAX;
    }
    inp.addEventListener("compositionstart",function(){comp=true});
    inp.addEventListener("compositionend",function(){comp=false;upd()});
    inp.addEventListener("input",upd);
    function go(){if(btn.disabled)return;A[i]=clip(inp.value.trim());next()}
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing)go()});
    btn.onclick=go;
    app.appendChild(inp);app.appendChild(cnt);app.appendChild(btn);
    inp.focus({preventScroll:true});
  }
}
function next(){i++;if(i>=S.length)done();else{show();window.scrollTo(0,0)}}
function done(){
  app.textContent="";
  var bar=h("div","bar"),f=h("i");f.style.width="100%";bar.appendChild(f);app.appendChild(bar);
  app.appendChild(h("h2",null,"[만약...]"));
  var cur="";
  S.forEach(function(s,k){
    if(s.g!==cur){cur=s.g;app.appendChild(h("p","sec","[만약..."+"("+cur+")]"))}
    var r=h("div","row");
    r.appendChild(h("p","if","만약 "+s.q));
    r.appendChild(h("p","then",A[k]));
    app.appendChild(r);
  });
  app.appendChild(h("p","final","[만약...]의 상황이 일어나지 않기를 바라며, 혹시 그런 상황이 닥치더라도 이 내용이 조금이나마 도움이 되기를 바라는 마음으로 응원을 보냅니다. 고생하셨습니다🍀"));
  var b=h("button","btn ghost","다시 하기");b.onclick=start;app.appendChild(b);
  window.scrollTo(0,0);
}
start();
</script>
<script data-goatcounter="https://taipougrefi.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
